<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="theme-color" content="#1f4e79">
<title>Weather</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
<style>
:root{--top:#1f4e79;--bot:#6fa8d6;--ink:#fff;--soft:rgba(255,255,255,.16);--soft2:rgba(255,255,255,.26)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(var(--top),var(--bot)) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .6s}
body.clear{--top:#1b5fa8;--bot:#7cc0ee}
body.cloud{--top:#46586b;--bot:#8fa1b3}
body.rain{--top:#26364a;--bot:#5b7390}
body.snow{--top:#5d7894;--bot:#c3d3e2}
body.storm{--top:#1c1f33;--bot:#4b4f72}
body.night{--top:#0e1730;--bot:#34476e}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button,input{font:inherit;color:inherit}
button{background:var(--soft);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;min-height:44px}
button:active{background:var(--soft2)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.search{position:relative}
.search input{width:100%;background:var(--soft);border:0;border-radius:14px;padding:13px 16px;min-height:48px}
.search input::placeholder{color:rgba(255,255,255,.7)}
#results{position:absolute;left:0;right:0;top:54px;background:#fff;color:#1a2633;border-radius:14px;overflow:hidden;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#results button{display:block;width:100%;text-align:left;background:none;border-radius:0;padding:13px 16px;border-bottom:1px solid #e6ebf0}
#results small{color:#5d6b7a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:none}
.chip.on{background:#fff;color:#1a2633}
.hero{text-align:center;padding:28px 0 18px}
.place{font-size:1.25rem;font-weight:600}
.temp{font-size:6.5rem;font-weight:200;line-height:1;letter-spacing:-.04em;margin:6px 0}
.cond{font-size:1.1rem}
.sub{opacity:.85;margin-top:4px;font-size:.95rem}
.actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:8px 0 16px}
.tabs button{flex:1;background:none}
.tabs button.on{background:#fff;color:#1a2633}
.panel{background:var(--soft);border-radius:20px;padding:6px 16px}
.hours{display:flex;gap:4px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.hr{flex:none;width:58px;text-align:center;display:grid;gap:6px;font-size:.9rem}
.hr .e,.day .e{font-size:1.5rem}
.hr .p{font-size:.75rem;color:#bfe3ff;min-height:1em}
.day{display:grid;grid-template-columns:64px 34px 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}
.day:last-child{border:0}
.rng{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;border-radius:5px;background:var(--soft);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px;background:#fff}
.dim{opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.15rem;font-weight:600;margin-top:2px}
.msg{text-align:center;padding:40px 10px;opacity:.9}
.hide{display:none}
.alert{background:#fff;color:#16324f;border-radius:16px;padding:12px 16px;margin:4px 0 8px;display:flex;gap:10px;align-items:center;font-weight:500}
.alert .e{font-size:1.5rem}
.card{background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:10px}
.zr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft)}
.zr:last-child{border:0}
html.dark body{--top:#0b1220;--bot:#1b2740}
#alertbtn.on{background:#fff;color:#1a2633}
</style>
</head>
<body>
<main>
  <div class="search">
    <input id="q" type="search" placeholder="Search for a city" autocomplete="off" aria-label="Search for a city">
    <div id="results" class="hide"></div>
  </div>
  <div class="chips" id="chips"></div>

  <section class="hero">
    <div class="place" id="place"></div>
    <div class="temp" id="temp">–</div>
    <div class="cond" id="cond"></div>
    <div class="sub" id="hilo"></div>
    <div class="sub" id="hebdate"></div>
    <div class="actions">
      <button id="save">Save place</button>
      <button id="def" class="hide">Make default</button>
      <button id="loc">Use my location</button>
      <button id="unit">°C</button>
      <button id="alertbtn">Rain alerts: off</button>
    </div>
  </section>
  <div class="alert hide" id="alert" role="status"></div>

  <div class="tabs" role="tablist">
    <button class="on" data-t="today" role="tab">Today</button>
    <button data-t="week" role="tab">7 days</button>
    <button data-t="jewish" role="tab">Jewish</button>
  </div>

  <div id="today">
    <div class="panel"><div class="hours" id="hours"></div></div>
    <div class="card" id="wear"></div>
    <div class="card hide" id="shab"></div>
    <div class="card hide" id="wknd"></div>
    <div class="card" id="rchart"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="week" class="hide"><div class="panel" id="days"></div></div>
  <div id="jewish" class="hide">
    <div class="alert hide" id="jalert"></div>
    <div class="panel" id="zman" style="margin-bottom:12px"></div>
    <div class="panel" id="jlist"><div class="msg">Loading…</div></div>
    <div class="actions"><button id="il">Diaspora holidays</button></div>
    <p class="dim" style="text-align:center;font-size:.8rem;margin-top:10px">Candle lighting 20 min before sunset, havdalah 30 min after. Data from Hebcal.</p>
  </div>
  <div class="actions" id="tools" style="margin-top:22px">
    <button id="radar">Rain radar</button><button id="share">Share forecast</button>
    <button id="dark">Dark mode: off</button><button id="size">Text size: normal</button><button id="lang">עברית</button>
  </div>
  <div class="msg hide" id="msg"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const WX = {0:['Clear','☀️','clear'],1:['Mostly clear','🌤️','clear'],2:['Partly cloudy','⛅','cloud'],3:['Overcast','☁️','cloud'],45:['Fog','🌫️','cloud'],48:['Fog','🌫️','cloud'],51:['Light drizzle','🌦️','rain'],53:['Drizzle','🌦️','rain'],55:['Heavy drizzle','🌧️','rain'],56:['Freezing drizzle','🌧️','rain'],57:['Freezing drizzle','🌧️','rain'],61:['Light rain','🌦️','rain'],63:['Rain','🌧️','rain'],65:['Heavy rain','🌧️','rain'],66:['Freezing rain','🌧️','rain'],67:['Freezing rain','🌧️','rain'],71:['Light snow','🌨️','snow'],73:['Snow','🌨️','snow'],75:['Heavy snow','❄️','snow'],77:['Snow grains','🌨️','snow'],80:['Showers','🌦️','rain'],81:['Showers','🌧️','rain'],82:['Heavy showers','🌧️','rain'],85:['Snow showers','🌨️','snow'],86:['Snow showers','🌨️','snow'],95:['Thunderstorm','⛈️','storm'],96:['Thunderstorm, hail','⛈️','storm'],99:['Thunderstorm, hail','⛈️','storm']};
const wx = c => WX[c] || ['Unknown','🌡️','cloud'];

// ---- storage (guarded: can be empty or blocked) ----
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let places = store.get('wx.places', []);
let defKey = store.get('wx.default', null);
let unit = store.get('wx.unit', 'C');
let cur = null; // {name, lat, lon}
const key = p => p.lat.toFixed(2) + ',' + p.lon.toFixed(2);

function persist(){ store.set('wx.places', places); store.set('wx.default', defKey); store.set('wx.unit', unit) }

// ---- chips / save buttons ----
function renderChips(){
  const c = $('chips'); c.innerHTML = '';
  places.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip' + (cur && key(cur) === key(p) ? ' on' : '');
    b.textContent = (key(p) === defKey ? '★ ' : '') + p.name;
    b.onclick = () => load(p);
    c.appendChild(b);
  });
  const saved = cur && places.some(p => key(p) === key(cur));
  $('save').textContent = saved ? 'Remove place' : 'Save place';
  $('save').classList.toggle('hide', !cur);
  $('def').classList.toggle('hide', !(saved && key(cur) !== defKey));
}
$('save').onclick = () => {
  if(!cur) return;
  const i = places.findIndex(p => key(p) === key(cur));
  if(i >= 0){ if(key(places[i]) === defKey) defKey = null; places.splice(i, 1) }
  else { places.push(cur); if(!defKey) defKey = key(cur) }
  persist(); renderChips();
};
$('def').onclick = () => { defKey = key(cur); persist(); renderChips() };
$('unit').onclick = () => { unit = unit === 'C' ? 'F' : 'C'; persist(); if(cur) load(cur) };

// ---- search ----
let t;
$('q').addEventListener('input', e => {
  clearTimeout(t);
  const v = e.target.value.trim();
  if(v.length < 2){ $('results').classList.add('hide'); return }
  t = setTimeout(() => search(v), 300);
});
async function search(v){
  try{
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(v));
    const j = await r.json();
    const box = $('results'); box.innerHTML = '';
    if(!j.results){ box.innerHTML = '<button disabled>No matches. Try a nearby city.</button>' }
    (j.results || []).forEach(x => {
      const b = document.createElement('button');
      const sub = [x.admin1, x.country].filter(Boolean).join(', ');
      b.innerHTML = '<span></span><br><small></small>';
      b.firstChild.textContent = x.name; b.querySelector('small').textContent = sub;
      b.onclick = () => { $('q').value = ''; box.classList.add('hide'); load({name: x.name, lat: x.latitude, lon: x.longitude}) };
      box.appendChild(b);
    });
    box.classList.remove('hide');
  }catch(e){ showMsg('Search needs an internet connection.') }
}
document.addEventListener('click', e => { if(!e.target.closest('.search')) $('results').classList.add('hide') });

$('loc').onclick = () => {
  if(!navigator.geolocation) return showMsg('Location is not available on this device.');
  $('loc').textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    p => { $('loc').textContent = 'Use my location'; load({name:'My location', lat:p.coords.latitude, lon:p.coords.longitude}) },
    () => { $('loc').textContent = 'Use my location'; showMsg('Location is blocked. Allow it in your browser settings, or search for a city.') },
    {timeout: 10000});
};

// ---- tabs ----
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('today').classList.toggle('hide', b.dataset.t !== 'today');
  $('week').classList.toggle('hide', b.dataset.t !== 'week');
  $('jewish').classList.toggle('hide', b.dataset.t !== 'jewish');
});

function showMsg(m){ const el = $('msg'); el.textContent = m; el.classList.remove('hide') }

// ---- load + render ----
async function load(p){
  cur = p; $('place').textContent = p.name; $('msg').classList.add('hide'); renderChips();
  const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day' +
    '&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max' +
    '&forecast_days=7&timezone=auto&temperature_unit=' + (unit === 'F' ? 'fahrenheit' : 'celsius') + '&wind_speed_unit=' + (unit === 'F' ? 'mph' : 'kmh');
  try{
    const r = await fetch(u); if(!r.ok) throw 0;
    const j = await r.json();
    store.set('wx.f.' + key(p) + unit, {t: Date.now(), j});
    render(j);
  }catch(e){
    const c = store.get('wx.f.' + key(p) + unit, null);
    if(c){ render(c.j); showMsg('You are offline. Showing the forecast saved ' + new Date(c.t).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}) + '.') }
    else showMsg('Could not load the forecast. Check your connection and try again.');
  }
}
const deg = n => Math.round(n) + '°';
const fmtH = s => new Date(s).toLocaleTimeString([], {hour:'numeric'}).replace(' ', '').toLowerCase();
const fmtT = s => new Date(s).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

function render(d){
  const c = d.current, [label, emoji, theme] = wx(c.weather_code);
  document.body.className = c.is_day ? theme : (theme === 'clear' || theme === 'cloud' ? 'night' : theme);
  $('temp').textContent = deg(c.temperature_2m);
  $('cond').textContent = emoji + ' ' + label;
  $('hilo').textContent = 'High ' + deg(d.daily.temperature_2m_max[0]) + ' · Low ' + deg(d.daily.temperature_2m_min[0]);
  $('unit').textContent = '°' + unit;

  // next 24 hours from current time (location's own clock)
  const hrs = $('hours'); hrs.innerHTML = '';
  const now = c.time.slice(0, 13);
  let i = d.hourly.time.findIndex(x => x.slice(0, 13) >= now); if(i < 0) i = 0;
  for(let k = i; k < Math.min(i + 24, d.hourly.time.length); k++){
    const el = document.createElement('div'); el.className = 'hr';
    const pp = d.hourly.precipitation_probability[k];
    el.innerHTML = '<span>' + (k === i ? 'Now' : fmtH(d.hourly.time[k])) + '</span><span class="e">' + wx(d.hourly.weather_code[k])[1] +
      '</span><b>' + deg(d.hourly.temperature_2m[k]) + '</b><span class="p">' + (pp >= 20 ? pp + '%' : '') + '</span>';
    hrs.appendChild(el);
  }
  checkRain(d, i);
  showHeb(d); loadJewish(d); wear(d, i); rainChart(d, i); weekend(d);
  lastText = cur.name + ': ' + deg(c.temperature_2m) + ' ' + emoji + ' ' + label + '. High ' + deg(d.daily.temperature_2m_max[0]) + ', low ' + deg(d.daily.temperature_2m_min[0]) + ', rain chance ' + d.daily.precipitation_probability_max[0] + '%.';
  const sp = unit === 'F' ? ' mph' : ' km/h';
  const stats = [['Feels like', deg(c.apparent_temperature)], ['Humidity', c.relative_humidity_2m + '%'], ['Wind', Math.round(c.wind_speed_10m) + sp],
    ['Rain chance', d.daily.precipitation_probability_max[0] + '%'], ['UV index', Math.round(d.daily.uv_index_max[0])], ['Sunrise', fmtT(d.daily.sunrise[0])], ['Sunset', fmtT(d.daily.sunset[0])]];
  $('stats').innerHTML = stats.map(s => '<div class="stat"><span class="dim">' + s[0] + '</span><b>' + s[1] + '</b></div>').join(''); aqi();

  // 7-day
  const lo = Math.min(...d.daily.temperature_2m_min), hi = Math.max(...d.daily.temperature_2m_max), span = (hi - lo) || 1;
  $('days').innerHTML = d.daily.time.map((t, k) => {
    const a = d.daily.temperature_2m_min[k], b = d.daily.temperature_2m_max[k], pr = d.daily.precipitation_probability_max[k];
    const name = k === 0 ? 'Today' : new Date(t + 'T12:00').toLocaleDateString([], {weekday:'short'});
    return '<div class="day"><span>' + name + '</span><span class="e" title="' + wx(d.daily.weather_code[k])[0] + '">' + wx(d.daily.weather_code[k])[1] +
      '</span><div class="rng"><span class="dim">' + deg(a) + '</span><div class="bar"><i style="left:' + ((a - lo) / span * 100) + '%;right:' + (100 - (b - lo) / span * 100) + '%"></i></div><span>' + deg(b) +
      '</span><span class="dim" style="width:38px;text-align:right;font-size:.8rem">' + (pr >= 20 ? pr + '%' : '') + '</span></div></div>';
  }).join('');
}

// ---- Jewish calendar ----
let il = store.get('wx.il', false);
function syncIl(){ $('il').textContent = il ? 'Israel holidays' : 'Diaspora holidays' }
$('il').onclick = () => { il = !il; store.set('wx.il', il); syncIl(); if(cur) load(cur) };
function showHeb(d){
  try{
    const t = d.current.time, after = t >= d.daily.sunset[0].slice(0, 16);
    const dt = new Date(t); if(after) dt.setDate(dt.getDate() + 1);
    const f = new Intl.DateTimeFormat((he ? 'he' : 'en') + '-u-ca-hebrew', {day:'numeric', month:'long', year:'numeric'}).format(dt);
    $('hebdate').textContent = '🕯️ ' + f + (after ? (he ? ' (התחיל בשקיעה)' : ' (began at sunset)') : '');
  }catch(e){ $('hebdate').textContent = '' }
}
const JE = {candles:'🕯️', havdalah:'✨', parashat:'📖', holiday:'🕎', roshchodesh:'🌙'};
const t12 = s => { const h = +s.slice(11, 13), m = s.slice(14, 16); return ((h % 12) || 12) + ':' + m + (h < 12 ? 'am' : 'pm') };
const ymd = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const dayName = (s, o) => new Date(s.slice(0, 10) + 'T12:00').toLocaleDateString([], o || {weekday:'short'});
let lastText = '';

async function zmanim(d, today){
  const box = $('zman'), ck = 'wx.zm.' + key(cur) + today;
  let t = null;
  try{
    const r = await fetch('https://www.hebcal.com/zmanim?cfg=json&latitude=' + cur.lat + '&longitude=' + cur.lon + '&tzid=' + encodeURIComponent(d.timezone) + '&date=' + today);
    if(!r.ok) throw 0; t = (await r.json()).times; store.set(ck, t);
  }catch(e){ t = store.get(ck, null) }
  if(!t){ box.innerHTML = '<div class="msg">Zmanim are not available right now.</div>'; return }
  const rows = [['alotHaShachar','Alot HaShachar','עלות השחר'],['misheyakir','Earliest tallis & tefillin','משיכיר'],['sunrise','Sunrise','הנץ החמה'],['sofZmanShma','Latest Shema','סוף זמן ק"ש'],['sofZmanTfilla','Latest Shacharis','סוף זמן תפילה'],['chatzot','Chatzos (midday)','חצות'],['minchaGedola','Mincha Gedola','מנחה גדולה'],['plagHaMincha','Plag HaMincha','פלג המנחה'],['sunset','Sunset','שקיעה'],['tzeit7083deg','Nightfall (tzeis)','צאת הכוכבים']];
  box.innerHTML = '<div style="padding:10px 0 4px;font-weight:600"></div>';
  box.firstChild.textContent = he ? 'זמני היום' : 'Today\u2019s zmanim';
  rows.forEach(r => {
    if(!t[r[0]]) return;
    const row = document.createElement('div'); row.className = 'zr'; row.innerHTML = '<span></span><b></b>';
    row.children[0].textContent = he ? r[2] : r[1]; row.children[1].textContent = t12(t[r[0]]);
    box.appendChild(row);
  });
}

function shabbosCard(items){
  const c = items.find(x => x.category === 'candles'), h = items.find(x => x.category === 'havdalah'), el = $('shab');
  if(!c && !h){ el.classList.add('hide'); return }
  const p = [];
  if(c) p.push((he ? 'הדלקת נרות ' : 'Candle lighting ') + dayName(c.date) + ' ' + t12(c.date));
  if(h) p.push((he ? 'הבדלה ' : 'Havdalah ') + dayName(h.date) + ' ' + t12(h.date));
  el.textContent = '🕯️ ' + p.join(' · '); el.classList.remove('hide');
}

function jBanner(items, d, today){
  const msgs = [], after = d.current.time >= d.daily.sunset[0].slice(0, 16);
  const t0 = new Date(today + 'T12:00'); if(after) t0.setDate(t0.getDate() + 1);
  const t2 = new Date(t0); t2.setDate(t2.getDate() + 2);
  const om = items.find(x => x.category === 'omer' && x.date.slice(0, 10) === ymd(t0));
  if(om) msgs.push('🌾 ' + (he && om.hebrew ? om.hebrew : om.title));
  const rc = items.find(x => x.category === 'roshchodesh' && x.date.slice(0, 10) >= today && x.date.slice(0, 10) <= ymd(t2));
  if(rc) msgs.push('🌙 ' + (he && rc.hebrew ? rc.hebrew : rc.title) + ' · ' + dayName(rc.date, {weekday:'long'}));
  const el = $('jalert');
  if(!msgs.length){ el.classList.add('hide'); return }
  el.innerHTML = ''; el.textContent = msgs.join('   '); el.classList.remove('hide');
}

async function loadJewish(d){
  const box = $('jlist'); box.innerHTML = '<div class="msg">Loading…</div>';
  const today = d.current.time.slice(0, 10), y = +today.slice(0, 4);
  const end = new Date(today + 'T12:00'); end.setDate(end.getDate() + 45);
  const endS = ymd(end), ck = 'wx.jc.' + key(cur) + (il ? 'i' : 'd');
  let items = null;
  try{
    const years = [y]; if(+today.slice(5, 7) >= 11) years.push(y + 1);
    const all = [];
    for(const yr of years){
      const u = 'https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&s=on&c=on&M=on&o=on&b=20&m=30&i=' + (il ? 'on' : 'off') +
        '&year=' + yr + '&month=x&geo=pos&latitude=' + cur.lat + '&longitude=' + cur.lon + '&tzid=' + encodeURIComponent(d.timezone);
      const r = await fetch(u); if(!r.ok) throw 0;
      all.push(...(await r.json()).items);
    }
    items = all.filter(x => x.date.slice(0, 10) >= today && x.date.slice(0, 10) <= endS);
    store.set(ck, items);
  }catch(e){
    const c = store.get(ck, null);
    if(c) items = c.filter(x => x.date.slice(0, 10) >= today);
  }
  zmanim(d, today);
  if(!items){ box.innerHTML = '<div class="msg">Could not load the Jewish calendar. Check your connection.</div>'; $('shab').classList.add('hide'); $('jalert').classList.add('hide'); return }
  shabbosCard(items); jBanner(items, d, today);
  const list = items.filter(x => x.category !== 'omer').slice(0, 25);
  if(!list.length){ box.innerHTML = '<div class="msg">Nothing coming up in the next 45 days.</div>'; return }
  box.innerHTML = '';
  list.forEach(x => {
    const row = document.createElement('div'); row.className = 'day'; row.style.gridTemplateColumns = '78px 30px 1fr';
    row.innerHTML = '<span class="dim"></span><span class="e"></span><span></span>';
    row.children[0].textContent = dayName(x.date, {weekday:'short', day:'numeric', month:'short'});
    row.children[1].textContent = JE[x.category] || '•';
    let txt;
    if(x.category === 'candles' || x.category === 'havdalah'){
      txt = (he ? (x.category === 'candles' ? 'הדלקת נרות' : 'הבדלה') : (x.category === 'candles' ? 'Candle lighting' : 'Havdalah')) + ' ' + t12(x.date);
    } else txt = he && x.hebrew ? x.hebrew : x.title + (x.hebrew ? ' · ' + x.hebrew : '');
    row.children[2].textContent = txt; row.children[2].dir = 'auto';
    box.appendChild(row);
  });
}

// ---- extra cards on the Today tab ----
function wear(d, i){
  let f = d.current.apparent_temperature; if(unit === 'F') f = (f - 32) * 5 / 9;
  const rain = Math.max(...d.hourly.precipitation_probability.slice(i, i + 12)), uv = d.daily.uv_index_max[0];
  const base = f <= 0 ? 'a heavy coat, hat and gloves' : f < 8 ? 'a warm coat' : f < 15 ? 'a jacket' : f < 22 ? 'a light layer' : f < 28 ? 'light clothing' : 'light clothes and water';
  let s = 'What to wear: ' + base;
  if(rain >= 40) s += ', plus an umbrella';
  if(uv >= 6 && d.current.is_day) s += ', plus sunscreen';
  $('wear').textContent = '🧥 ' + s + '.';
}
function rainChart(d, i){
  const p = d.hourly.precipitation_probability.slice(i, i + 24), bw = 100 / p.length;
  let bars = '';
  p.forEach((v, k) => { const h = Math.max(1, v * 0.6); bars += '<rect x="' + (k * bw + bw * .15) + '" y="' + (60 - h) + '" width="' + (bw * .7) + '" height="' + h + '" fill="#fff" opacity="' + (v >= 50 ? 1 : .55) + '"/>' });
  $('rchart').innerHTML = '<div class="dim" style="margin-bottom:6px">Chance of rain, next 24 hours</div><svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:70px;display:block" role="img" aria-label="Rain chance by hour">' + bars + '</svg><div class="dim" style="display:flex;justify-content:space-between;font-size:.75rem;margin-top:4px"><span>Now</span><span>+12h</span><span>+24h</span></div>';
}
function weekend(d){
  const el = $('wknd'), T = d.daily.time, g = k => new Date(T[k] + 'T12:00').getDay();
  const k0 = T.findIndex((t, k) => g(k) === 5 || g(k) === 6);
  if(k0 < 0){ el.classList.add('hide'); return }
  const ks = [k0]; if(g(k0) === 5 && k0 + 1 < T.length) ks.push(k0 + 1);
  el.innerHTML = '<div class="dim" style="margin-bottom:6px"></div>';
  el.firstChild.textContent = he ? 'תחזית לשבת' : 'Shabbos forecast';
  ks.forEach(k => {
    const r = document.createElement('div'); r.className = 'zr';
    r.innerHTML = '<span></span><b></b>';
    const pr = d.daily.precipitation_probability_max[k];
    r.children[0].textContent = dayName(T[k], {weekday:'long'}) + ' ' + wx(d.daily.weather_code[k])[1];
    r.children[1].textContent = deg(d.daily.temperature_2m_max[k]) + ' / ' + deg(d.daily.temperature_2m_min[k]) + (pr >= 20 ? ' · ' + pr + '% rain' : '');
    el.appendChild(r);
  });
  el.classList.remove('hide');
}
async function aqi(){
  const p = cur, k = key(p);
  try{
    const r = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?current=us_aqi&latitude=' + p.lat + '&longitude=' + p.lon);
    const v = (await r.json()).current.us_aqi;
    if(v == null || !cur || key(cur) !== k) return;
    const lab = v <= 50 ? 'Good' : v <= 100 ? 'Moderate' : v <= 150 ? 'Poor for sensitive groups' : v <= 200 ? 'Unhealthy' : 'Very unhealthy';
    const old = $('aqi'); if(old) old.remove();
    const el = document.createElement('div'); el.className = 'stat'; el.id = 'aqi';
    el.innerHTML = '<span class="dim">Air quality</span><b></b>'; el.lastChild.textContent = Math.round(v) + ' · ' + lab;
    $('stats').appendChild(el);
  }catch(e){}
}

// ---- display options and tools ----
let dark = store.get('wx.dark', false), tsz = store.get('wx.tsz', 0), he = store.get('wx.he', false);
function applyPrefs(){
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.style.fontSize = [100, 115, 130][tsz] + '%';
  $('dark').textContent = 'Dark mode: ' + (dark ? 'on' : 'off');
  $('size').textContent = 'Text size: ' + ['normal', 'large', 'largest'][tsz];
  $('lang').textContent = he ? 'English' : 'עברית';
}
$('dark').onclick = () => { dark = !dark; store.set('wx.dark', dark); applyPrefs() };
$('size').onclick = () => { tsz = (tsz + 1) % 3; store.set('wx.tsz', tsz); applyPrefs() };
$('lang').onclick = () => { he = !he; store.set('wx.he', he); applyPrefs(); if(cur) load(cur) };
$('radar').onclick = () => { if(cur) window.open('https://www.rainviewer.com/map.html?loc=' + cur.lat + ',' + cur.lon + ',7', '_blank', 'noopener') };
$('share').onclick = async () => {
  if(!lastText) return;
  try{
    if(navigator.share) await navigator.share({title: 'Weather', text: lastText});
    else { await navigator.clipboard.writeText(lastText); showMsg('Forecast copied. Paste it into a message.') }
  }catch(e){}
};

// ---- rain alerts ----
let alertsOn = store.get('wx.alerts', false);
const canNotify = () => 'Notification' in window;
function syncAlertBtn(){
  const b = $('alertbtn');
  b.textContent = 'Rain alerts: ' + (alertsOn ? 'on' : 'off');
  b.classList.toggle('on', alertsOn);
}
$('alertbtn').onclick = async () => {
  if(alertsOn){ alertsOn = false; store.set('wx.alerts', false); syncAlertBtn(); return }
  if(!canNotify()){ alertsOn = true; store.set('wx.alerts', true); syncAlertBtn(); if(cur) load(cur); showMsg('This browser can\u2019t show pop-up notifications, so alerts will appear as a banner at the top of the app.'); return }
  let perm = Notification.permission;
  if(perm === 'default'){ try{ perm = await Notification.requestPermission() }catch(e){} }
  alertsOn = true; store.set('wx.alerts', true); syncAlertBtn();
  if(cur) load(cur);
  if(perm !== 'granted') showMsg('Notifications are blocked, so alerts will show as a banner in the app. Allow notifications in your browser settings for pop-ups.');
};
function checkRain(d, i){
  const box = $('alert'), pr = d.hourly.precipitation_probability, tm = d.hourly.time;
  let hit = -1;
  for(let k = i; k < Math.min(i + 12, tm.length); k++){ if(pr[k] >= 50){ hit = k; break } }
  if(hit < 0 || !alertsOn){ box.classList.add('hide'); return }
  const when = hit === i ? 'now' : 'around ' + fmtH(tm[hit]);
  const text = 'Rain likely ' + when + ' in ' + cur.name + ' (' + pr[hit] + '% chance)';
  box.innerHTML = '<span class="e">🌧️</span><span></span>';
  box.lastChild.textContent = text; box.classList.remove('hide');
  // one pop-up per place per rain hour
  const id = key(cur) + '|' + tm[hit].slice(0, 13);
  if(canNotify() && Notification.permission === 'granted' && store.get('wx.lastAlert', '') !== id){
    store.set('wx.lastAlert', id);
    try{ new Notification('Rain alert', {body: text}) }catch(e){}
  }
}
// refresh every 15 min while the app is open and visible
setInterval(() => { if(cur && !document.hidden) load(cur) }, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && cur) load(cur) });
syncAlertBtn(); syncIl(); applyPrefs();

// ---- start: default place, else prompt ----
(function init(){
  const d = places.find(p => key(p) === defKey) || places[0];
  renderChips();
  if(d) load(d);
  else showMsg('Search for a city or tap “Use my location” to see the forecast.');
})();
</script>
